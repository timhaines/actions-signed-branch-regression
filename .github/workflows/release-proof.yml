name: Release proof

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Run release task
        env:
          RELEASE_SYNTHETIC_SECRET: ${{ secrets.RELEASE_SYNTHETIC_SECRET }}
        run: ./release-task.sh
